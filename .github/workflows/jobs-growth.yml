name: InPursuit jobs growth

on:
  push:
    branches: [main]
  schedule:
    # 10:00 IST daily. New roles are capped in Python; the hub digest runs Mon/Thu.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true to print posts without sending or saving state"
        required: false
        default: "false"

concurrency:
  group: jobs-growth-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Audit live jobs pages
        run: PYTHONPATH=. python -m pehli_salary.cli jobs audit
      - name: Promote new roles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: |
          EXTRA=()
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            EXTRA+=(--dry-run)
          fi
          PYTHONPATH=. python -m pehli_salary.cli jobs promote "${EXTRA[@]}"
      - name: Commit promoted-state to main
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel/jobs_promoted.json
          if git diff --staged --quiet; then
            echo "No promoted-state changes."
            exit 0
          fi
          git commit -m "chore(jobs): sync promoted state [skip ci]"
          git push origin HEAD:main
      - name: Deploy discovery files to Hostinger
        if: ${{ secrets.HOSTINGER_FTP_HOST != '' && secrets.HOSTINGER_FTP_USERNAME != '' && secrets.HOSTINGER_FTP_PASSWORD != '' }}
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP

          host = os.environ["HOSTINGER_FTP_HOST"]
          user = os.environ["HOSTINGER_FTP_USERNAME"]
          password = os.environ["HOSTINGER_FTP_PASSWORD"]
          ftp = FTP()
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, password)
          ftp.set_pasv(True)

          def ensure(path):
              parts = [p for p in path.split("/") if p]
              for part in parts:
                  if part not in ftp.nlst():
                      try:
                          ftp.mkd(part)
                      except Exception:
                          pass
                  ftp.cwd(part)

          ftp.cwd("/")
          with open("site/f3c8e1a94b6d4027c5e8a1d09b7f6c2e.txt", "rb") as fh:
              ftp.storbinary("STOR f3c8e1a94b6d4027c5e8a1d09b7f6c2e.txt", fh)
          ftp.cwd("/")
          ensure("wp-content/mu-plugins")
          with open("site/mu-plugins/inpursuit-jobs-discovery.php", "rb") as fh:
              ftp.storbinary("STOR inpursuit-jobs-discovery.php", fh)
          ftp.quit()
          print("Uploaded IndexNow key and jobs discovery plugin.")
          PY

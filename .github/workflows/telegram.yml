name: Telegram channel posts

on:
  schedule:
    # Tue / Thu / Sat 11:11 IST (05:41 UTC)
    - cron: "41 5 * * 2,4,6"
    # Poll job feeds every 6 hours
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true to print payloads without posting"
        required: false
        default: "false"
      post_tip:
        description: "Post next finance tip (manual)"
        required: false
        default: "false"
      poll_jobs:
        description: "Poll job RSS feeds"
        required: false
        default: "true"

jobs:
  post-tip:
    if: github.event.schedule == '41 5 * * 2,4,6' || inputs.post_tip == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore posted-state cache
        uses: actions/cache@v4
        with:
          path: .telegram
          key: telegram-state-${{ github.repository }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Post finance tip
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          EXTRA=()
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            EXTRA+=(--dry-run)
          fi
          PYTHONPATH=. python -m pehli_salary.cli telegram post-tip "${EXTRA[@]}"

  poll-jobs:
    if: github.event.schedule == '15 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.poll_jobs == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore posted-state cache
        uses: actions/cache@v4
        with:
          path: .telegram
          key: telegram-state-${{ github.repository }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Poll job feeds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          EXTRA=()
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            EXTRA+=(--dry-run)
          fi
          PYTHONPATH=. python -m pehli_salary.cli telegram poll-jobs "${EXTRA[@]}"

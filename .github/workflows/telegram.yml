name: Telegram channel posts

on:
  schedule:
    # Tue / Thu / Sat 11:11 IST (05:41 UTC)
    - cron: "41 5 * * 2,4,6"
    # Poll job feeds every 6 hours
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true to print payloads without posting"
        required: false
        default: "false"
      post_tip:
        description: "Post next finance tip (manual)"
        required: false
        default: "false"
      poll_jobs:
        description: "Poll job RSS feeds"
        required: false
        default: "false"

concurrency:
  group: telegram-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Post finance tip
        if: github.event.schedule == '41 5 * * 2,4,6' || inputs.post_tip == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          EXTRA=()
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            EXTRA+=(--dry-run)
          fi
          PYTHONPATH=. python -m pehli_salary.cli telegram post-tip "${EXTRA[@]}"
      - name: Poll job feeds
        if: github.event.schedule == '15 */6 * * *' || inputs.poll_jobs == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          EXTRA=()
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            EXTRA+=(--dry-run)
          fi
          PYTHONPATH=. python -m pehli_salary.cli telegram poll-jobs "${EXTRA[@]}"
      - name: Commit posted-state to main
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel/telegram_posted.json
          if git diff --staged --quiet; then
            echo "No posted-state changes."
            exit 0
          fi
          git commit -m "chore(telegram): sync posted state [skip ci]"
          git push origin HEAD:main

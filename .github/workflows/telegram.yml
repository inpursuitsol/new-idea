name: Telegram channel posts

on:
  schedule:
    # Tue / Thu / Sat 09:00 IST
    - cron: "30 3 * * 2,4,6"
    # Poll job feeds every 6 hours
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true to print payloads without posting"
        required: false
        default: "false"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Tests
        run: PYTHONPATH=. python -m pytest -q tests/test_telegram.py
      - name: Post due tips and poll jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          EXTRA=()
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            EXTRA+=(--dry-run)
          fi
          PYTHONPATH=. python -m pehli_salary.cli telegram post-due "${EXTRA[@]}"
